<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kfz. Ingenieurbüro TAM - TÜV NORD</title>
  <style>
    :root {
      --tuv-blue: #003E92;      /* Pantone 293 C */
      --tuv-navy: #041E42;      /* Pantone 282 C */
      --tuv-dark-btn: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    /* Dış kart tamamen dikdörtgen (Rechteck) */
    .card { background: #ffffff; width: 100%; max-width: 440px; border-radius: 0px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; overflow: hidden; border: 1px solid #cbd5e1; }
    
    /* Tabela Üst Bloğu: Dikdörtgen ve Hizalı */
    .header-navy-block {
      background-color: var(--tuv-navy);
      padding: 12px 18px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 80px;
    }
    
    .tuv-logo {
      height: 56px;
      width: auto;
      object-fit: contain;
      display: block;
      border-radius: 0px;
    }

    .header-title-text {
      color: #ffffff;
      font-size: 25px; /* Yazı belirgin şekilde büyütüldü */
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .content-area { padding: 24px; }
    
    .title { font-size: 24px; font-weight: 800; color: var(--tuv-blue); margin-bottom: 2px; line-height: 1.2; }
    .subtitle { font-size: 17px; font-weight: 700; color: #334155; margin-bottom: 18px; }
    
    /* İç kutular hafif yumuşak veya düz uyumlu */
    .hours-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 16px; margin-bottom: 20px; text-align: left; font-size: 13.5px; color: #334155; line-height: 1.6; }
    .hours-box strong { display: block; margin-bottom: 6px; color: #0f172a; font-size: 14px; }
    .address-line { font-weight: 600; color: var(--tuv-blue); margin-top: 8px; font-size: 13px; }
    .note { margin-top: 6px; font-weight: 700; color: #16a34a; font-size: 12.5px; }

    .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 15px; transition: transform 0.1s ease, background 0.2s ease; }
    .btn:active { transform: scale(0.98); }
    
    .btn-maps { background: var(--tuv-blue); color: #ffffff; }
    .btn-maps:hover { background: #002e70; }
    .btn-termin { background: var(--tuv-dark-btn); color: #ffffff; }
    .btn-termin:hover { background: #1e293b; }
    .btn-call { background: #16a34a; color: #ffffff; }
    .btn-call:hover { background: #15803d; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Üst Tabela Alanı -->
    <div class="header-navy-block">
      <img src="logo%20t%C3%BCv.png" alt="TÜV NORD Logo" class="tuv-logo">
      <div class="header-title-text">Kfz-Prüfstelle</div>
    </div>

    <div class="content-area">
      <div class="title">Duisburg-Hochfeld</div>
      <div class="subtitle">(Kfz-Ingenieurbüro TAM)</div>

      <div class="hours-box">
        <strong>🕒 Öffnungszeiten:</strong>
        Mo. - Fr.: 10:30 – 17:00 Uhr<br>
        Freitag: Mittagspause 12:30 – 14:30 Uhr
        <div class="address-line">📍 Karl-Jarres-Str. 92, 47051 Duisburg</div>
        <div class="note">✓ Auch ohne Termin möglich</div>
      </div>

      <!-- 1. Buton: Harita / Rota -->
      <a href="https://maps.app.goo.gl/zzQxrJthEDKbPZXr5" class="btn btn-maps" target="_blank">
        📍 Route & Anfahrt
      </a>

      <!-- 2. Buton: Online Randevu -->
      <a href="https://www.tuev-nord.de/de/stationen/duisburg-hochfeld-kfz-ingenieurbuero-tam/" class="btn btn-termin" target="_blank">
        📅 Online-Termin Buchen
      </a>

      <!-- 3. Buton: Telefon Arama -->
      <a href="tel:+491636814777" class="btn btn-call">
        📞 Tel: +49 163 68 14 777
      </a>
    </div>
  </div>

</body>
</html>
