<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kfz. Ingenieurbüro TAM - TÜV NORD</title>
  <style>
    :root {
      --tuv-blue: #003E92;     /* Pantone 293 C */
      --tuv-navy-base: #041E42;/* Pantone 282 C */
      --tuv-dark: #002860;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; overflow: hidden; }
    
    /* Logo Üst Alanı */
    .header-bar { display: flex; justify-content: flex-end; align-items: center; padding: 16px 24px; background: #ffffff; }
    .tuv-logo { height: 42px; width: auto; object-fit: contain; }

    /* Logonun Tabanındaki PMS 282 C Şeridi */
    .tuv-base-strip { height: 6px; width: 100%; background-color: var(--tuv-navy-base); }

    .content-area { padding: 24px; }
    
    .station-label { font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
    .title { font-size: 22px; font-weight: 800; color: var(--tuv-blue); margin-bottom: 2px; line-height: 1.2; }
    .subtitle { font-size: 17px; font-weight: 700; color: #334155; margin-bottom: 16px; }
    
    .hours-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 20px; text-align: left; font-size: 13.5px; color: #334155; line-height: 1.6; }
    .hours-box strong { display: block; margin-bottom: 6px; color: #0f172a; font-size: 14px; }
    .address-line { font-weight: 600; color: var(--tuv-blue); margin-top: 8px; font-size: 13px; }
    .note { margin-top: 6px; font-weight: 700; color: #16a34a; font-size: 12.5px; }

    .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px; transition: transform 0.1s ease, background 0.2s ease; }
    .btn:active { transform: scale(0.98); }
    
    .btn-maps { background: var(--tuv-blue); color: #ffffff; }
    .btn-maps:hover { background: var(--tuv-dark); }
    .btn-termin { background: #0f172a; color: #ffffff; }
    .btn-termin:hover { background: #1e293b; }
    .btn-call { background: #16a34a; color: #ffffff; }
    .btn-call:hover { background: #15803d; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Sağ Üst Köşe Logo -->
    <div class="header-bar">
      <img src="logo%20t%C3%BCv.png" alt="TÜV NORD Logo" class="tuv-logo">
    </div>

    <!-- Logonun Altındaki PMS 282 C Taban Şeridi -->
    <div class="tuv-base-strip"></div>

    <div class="content-area">
      <div class="station-label">TÜV NORD Station</div>
      <div class="title">Duisburg-Hochfeld</div>
      <div class="subtitle">(Kfz-Ingenieurbüro TAM)</div>

      <div class="hours-box">
        <strong>🕒 Öffnungszeiten:</strong>
        Mo. - Fr.: 10:30 – 17:00 Uhr<br>
        Freitag: Mittagspause 12:30 – 14:30 Uhr
        <div class="address-line">📍 Karl-Jarres-Str. 92, 47051 Duisburg</div>
        <div class="note">✓ Auch ohne Termin möglich</div>
      </div>

      <!-- 1. Buton: Harita / Rota -->
      <a href="https://maps.app.goo.gl/zzQxrJthEDKbPZXr5" class="btn btn-maps" target="_blank">
        📍 Route & Anfahrt
      </a>

      <!-- 2. Buton: Online Randevu -->
      <a href="https://www.tuev-nord.de/de/stationen/duisburg-hochfeld-kfz-ingenieurbuero-tam/" class="btn btn-termin" target="_blank">
        📅 Online-Termin Buchen
      </a>

      <!-- 3. Buton: Telefon Arama -->
      <a href="tel:+491636814777" class="btn btn-call">
        📞 Tel: +49 163 68 14 777
      </a>
    </div>
  </div>

</body>
</html>
